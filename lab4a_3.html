<!DOCTYPE html>
<html>
    <head>
        <title>Lab 4a Q3</title>
    </head>
    <body>
        <button id="generateBtn" type="button">Generate</button>
        <ol id="numberList"></ol>
    </body>
    <script>
        document.getElementById("generateBtn").addEventListener("click", generateNumbers);
        function generateNumbers() {
            let ol = document.getElementById("numberList");
            ol.innerHTML = "";

            for (let i=1 ; i<=5; i++) {
                var li = document.createElement('li');
                li.textContent = "This number is " + i;
                ol.appendChild(li);
            }
        }
    </script>
</html>
